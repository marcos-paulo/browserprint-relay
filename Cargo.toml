[package]
name = "browserprint-relay"
version = "0.1.0"
edition = "2021"
description = "Relay de rede pro Zebra Browser Print (que só escuta em localhost), com ícone de status na bandeja do Windows."
license = "MIT"

[[bin]]
name = "browserprint-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"] }
tray-icon = "0.25"
tao = "0.37"
anyhow = "1"
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
